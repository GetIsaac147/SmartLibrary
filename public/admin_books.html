<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLibrary | Gestión de Libros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./dashboard.html">
        <i class="bi bi-arrow-left me-2"></i>Volver al Dashboard
      </a>
    </div>
  </nav>

  <div class="container pb-5">
    
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card bg-primary text-white border-0 shadow-sm">
          <div class="card-body p-4 text-center">
            <h6 class="text-uppercase small fw-bold opacity-75">Total Libros</h6>
            <h2 id="totalBooksCount" class="display-6 fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-danger text-white border-0 shadow-sm">
          <div class="card-body p-4 text-center">
            <h6 class="text-uppercase small fw-bold opacity-75">Agotados</h6>
            <h2 id="outOfStockCount" class="display-6 fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-success text-white border-0 shadow-sm">
          <div class="card-body p-4 text-center">
            <h6 class="text-uppercase small fw-bold opacity-75">Disponibles</h6>
            <h2 id="availableCount" class="display-6 fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-4 text-dark">Añadir Nuevo Libro</h5>
            <form id="bookForm">
              <div class="mb-2">
                <input id="title" class="form-control" placeholder="Título" required>
              </div>
              <div class="mb-2">
                <input id="author" class="form-control" placeholder="Autor" required>
              </div>
              <div class="mb-2">
                <input id="isbn" class="form-control" placeholder="ISBN" required>
              </div>
              <div class="mb-2">
                <input id="category" class="form-control" placeholder="Categoría" required>
              </div>
              <div class="row g-2 mb-3">
                <div class="col">
                  <label class="form-label small text-muted mb-1">Total</label>
                  <input id="totalCopies" type="number" class="form-control" placeholder="Stock" required>
                </div>
                <div class="col">
                  <label class="form-label small text-muted mb-1">Disp.</label>
                  <input id="available" type="number" class="form-control" placeholder="Disp." required>
                </div>
              </div>
              <button class="btn btn-success w-100 py-2 fw-bold">
                <i class="bi bi-save me-2"></i>Guardar Libro
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
              <h5 class="fw-bold m-0 text-dark">Inventario de Libros</h5>
              <div class="input-group" style="max-width: 300px;">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Buscar título o autor...">
              </div>
            </div>
            
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th class="py-3">Libro</th>
                    <th class="py-3">Autor</th>
                    <th class="py-3 text-center">Estatus</th>
                    <th class="py-3 text-center">Stock</th>
                    <th class="py-3 text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="booksTableBody">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white border-0">
          <h5 class="modal-title fw-bold">Editar Libro</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="editBookForm">
            <input type="hidden" id="editBookId">
            <div class="mb-3">
              <label class="form-label small fw-bold">Título</label>
              <input id="editTitle" class="form-control mb-2" placeholder="Título">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Autor</label>
              <input id="editAuthor" class="form-control mb-2" placeholder="Autor">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Copias Disponibles</label>
              <input id="editAvailable" type="number" class="form-control" placeholder="Disponibles">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-bold shadow-sm">
              Guardar Cambios
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./assets/js/admin_logic.js"></script>
</body>
</html>
