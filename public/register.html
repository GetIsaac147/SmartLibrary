<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SmartLibrary - Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#141e30,#243b55);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background: radial-gradient(circle,rgba(255,255,255,0.08) 10%, transparent 10%);
    background-size:60px 60px;
    animation:moveBg 25s linear infinite;
}

@keyframes moveBg{
    0%{transform:translate(0,0);}
    100%{transform:translate(-60px,-60px);}
}

.container{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    width:350px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
    text-align:center;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    color:#fff;
    margin-bottom:10px;
}

.subtitle{
    color:#bbb;
    margin-bottom:30px;
    font-size:14px;
}

.input-group{
    position:relative;
    margin-bottom:25px;
}

.input-group input{
    width:100%;
    padding:10px;
    background:transparent;
    border:none;
    border-bottom:2px solid #aaa;
    color:#fff;
    outline:none;
    transition:0.3s;
}

.input-group label{
    position:absolute;
    top:10px;
    left:0;
    color:#aaa;
    font-size:14px;
    pointer-events:none;
    transition:0.3s;
}

.input-group input:focus,
.input-group input:valid{
    border-bottom:2px solid #00ffcc;
}

.input-group input:focus + label,
.input-group input:valid + label{
    top:-10px;
    font-size:12px;
    color:#00ffcc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00ffcc,#0099ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00ffcc;
}

.link{
    margin-top:15px;
    display:block;
    color:#aaa;
    font-size:14px;
}

.link a{
    color:#00ffcc;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
    <h1>📖 Crear Cuenta</h1>
    <p class="subtitle">Únete a SmartLibrary</p>

    <form id="registerForm">
        <div class="input-group">
            <input type="text" id="name" required>
            <label>Nombre</label>
        </div>

        <div class="input-group">
            <input type="email" id="email" required>
            <label>Correo electrónico</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" required>
            <label>Contraseña</label>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <p class="link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let user = { name, email, password };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Cuenta creada con éxito 🚀");
    window.location.href = "login.html";
});
</script>

</body>
</html>
